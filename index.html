/* Layout : carte plein écran en canvas, panneau latéral (bureau) ou onglets (mobile).

:root {
  --stone: #BBA987;

  --stone-3: #A3906B;

  --ink: #26221B;
  --ink-2: #5A5040;
  --water: #5E7D96;
  --bois: #97A079;
  --r0: #77715F; --r1: #3F7D62; --r2: #2D63B0; --r3: #7A3F8F; --r4: #B5862A;
  --f-plaque: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-ui: "Barlow", "Helvetica Neue", Arial, sans-serif;

  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--stone); color: var(--ink); font-family: var(--f-ui); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }

sup { font-size: .62em; line-height: 0; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--stone); border-bottom: 1px solid var(--joint);
}
.logo {
  display: inline-flex; flex-direction: column; align-items: center;
  background: var(--navy); color: var(--white); border-radius: 7px; padding: 4px 14px 5px; margin: 3px; line-height: 1;
  box-shadow: 0 0 0 3px var(--green), inset 0 0 0 1.5px var(--white), 0 2px 0 3px rgba(0,0,0,.15);
}
.logo small { font-family: var(--f-plaque); font-weight: 500; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }

.counter b { font-family: var(--f-plaque); font-size: 19px; font-weight: 700; color: var(--navy); white-space: nowrap; }

}
.app, .main { min-width: 0; max-width: 100vw; }

.main { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr; }

.map-top {

  box-shadow: 0 0 0 4px var(--green), inset 0 0 0 1.5px var(--white), 0 8px 24px rgba(10,16,30,.35);

}
.sheet-text { flex: 1 1 220px; min-width: 0; }
.eyebrow { font-family: var(--f-plaque); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .78; display: flex; align-items: center; gap: 6px; }

.btn { border: 0; border-radius: 7px; padding: 11px 18px; background: var(--green-2); color: var(--white); box-shadow: inset 0 0 0 1.5px rgba(246,242,232,.55); font-family: var(--f-plaque); font-weight: 700; font-size: 16px; letter-spacing: .07em; text-transform: uppercase; transition: transform .12s, filter .12s; }

.cols { display: flex; flex-direction: column; gap: 10px; }

/* Menus déroulants Famille / Collection */

.dd-body { padding: 8px 10px 12px; max-height: min(56vh, 460px); overflow-y: auto; overscroll-behavior: contain; }
.cols .col { border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 7px; font: inherit; color: inherit; width: 100%; }

.cols .col.all strong { color: var(--navy); }
.cols { gap: 4px; }
.filter-chip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 4px 10px 4px 12px; background: var(--navy); color: var(--white); font-family: var(--f-plaque); font-weight: 600; font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; }

.pack-next { font-family: var(--f-plaque); font-size: 16px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.acct { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-2); }

.modal.pack { background: rgba(14, 21, 34, .92); }

@media (min-width: 700px) { .pack-grid { grid-template-columns: repeat(5, 1fr); gap: 16px 14px; } .modal.pack #modalCard, .modal.pack .modal-box { width: min(860px, 100%); } }
.pcard { border: 0; padding: 0; background: none; position: relative; aspect-ratio: 5 / 7; perspective: 1200px; }
.pflip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.3,1); transform: rotateY(180deg); }
.pcard.open .pflip { transform: none; }
.pface { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.pcover { transform: rotateY(180deg); }
.cover { height: 100%; border-radius: 9px; background: var(--green); padding: 7%; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.cover div { height: 100%; border-radius: 6px; background: var(--navy); box-shadow: inset 0 0 0 2px var(--white); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: var(--f-plaque); text-transform: uppercase; }

.ptag.new { background: var(--r4); color: var(--navy); }
.copies { position: absolute; right: .45em; bottom: .4em; font-family: var(--f-plaque); font-weight: 700; font-size: .7em; color: var(--white); background: var(--navy); padding: .05em .4em; border-radius: .25em; }
.scouts { display: flex; flex-direction: column; gap: 10px; }
.scout { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; background: var(--stone-2); border-radius: 10px; padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--joint); }
.scout .ring { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--white); box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--green-2); font-family: var(--f-plaque); font-weight: 700; font-size: 20px; }
.scout strong { display: block; color: var(--navy); font-weight: 600; line-height: 1.2; }

.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--navy); box-shadow: 0 -3px 0 var(--green); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); position: relative; z-index: 6; }

.tabbar .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--r4); color: var(--navy); font-size: 11px; line-height: 16px; margin-left: 3px; }

@media (min-width: 900px) {
  .main { grid-template-columns: 1fr 420px; }
  .side { position: relative; inset: auto; display: block !important; border-left: 4px solid var(--green); }
  .tabbar { display: none; }
  .side-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
  .side-tabs button.srv { opacity: .62; }
  .side-tabs button { border: 0; border-radius: 6px; padding: 5px 9px; font-size: 13.5px !important; background: var(--stone-2); color: var(--ink-2); font-family: var(--f-plaque); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; box-shadow: inset 0 0 0 1px var(--joint); }

}

/* Cartes */
.card { position: relative; width: 100%; aspect-ratio: 5 / 7; max-width: 100%; container-type: inline-size; perspective: 1400px; }
.card .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.3,1); }
.card.flipped .flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-size: 5cqw; border-radius: .7em; background: var(--green); padding: .42em; box-shadow: 0 .15em .5em rgba(10,16,30,.25); }
.face.back { transform: rotateY(180deg); }
.face-in { height: 100%; border-radius: .45em; background: var(--navy); color: var(--white); box-shadow: inset 0 0 0 .12em var(--white); padding: .75em .75em 0; display: flex; flex-direction: column; gap: .4em; overflow: hidden; }
.c-top { display: flex; justify-content: space-between; align-items: center; gap: .5em; font-family: var(--f-plaque); font-size: .78em; letter-spacing: .06em; white-space: nowrap; }
.c-top .type { text-transform: uppercase; font-weight: 600; letter-spacing: .08em; padding: .1em .55em; border-radius: .3em; background: var(--c); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.c-name { font-family: var(--f-plaque); font-weight: 700; font-size: 1.45em; line-height: .98; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 1.96em; }
.c-latin { font-family: var(--f-text); font-style: italic; font-size: .76em; opacity: .78; margin-top: -.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3em; }
.c-art { flex: 1; min-height: 0; position: relative; border-radius: .3em; overflow: hidden; background-color: var(--stone-2); background-image: repeating-linear-gradient(180deg, transparent 0 1.9em, var(--joint) 1.9em 2em), linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.06)); }
.c-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.c-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.credits { font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.credits a { color: var(--navy); }
.pips { position: absolute; top: .45em; left: .5em; display: flex; gap: .22em; }
.pips i { width: .55em; height: .55em; transform: rotate(45deg); background: rgba(23,43,77,.2); border: .08em solid var(--navy); }
.pips i.on { background: var(--navy); }
.lab { position: absolute; top: .4em; right: .45em; font-family: var(--f-plaque); font-size: .62em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--white); background: var(--c); padding: .1em .4em; border-radius: .25em; }
.c-stats { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: .3em; text-align: center; }
.c-stats div { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.c-stats small { font-family: var(--f-plaque); font-size: .58em; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.c-stats b { font-family: var(--f-plaque); font-size: 1.05em; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-stats b.long { font-size: .8em; padding-top: .15em; }
.c-band { margin: 0 -.75em; padding: .35em .75em .45em; display: flex; justify-content: space-between; align-items: baseline; gap: .6em; color: var(--white); }
.c-band b { font-family: var(--f-plaque); font-size: .8em; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.c-band span { font-size: .6em; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.back .face-in { padding: .9em; gap: .5em; }

.back .why { font-family: var(--f-text); font-size: .74em; line-height: 1.35; margin: 0; padding: .45em .55em; background: rgba(246,242,232,.1); border-radius: .3em; }

.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(14, 21, 34, .78); padding: 20px max(16px, env(safe-area-inset-left, 0px)) 20px max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.modal-box { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(330px, 100%); }
.modal-msg { text-align: center; color: var(--white); }

.modal-msg .t { font-family: var(--f-plaque); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; }
.modal-msg .s { font-size: 14px; opacity: .9; margin-top: 4px; }
#modalCard { width: min(320px, 100%, calc((100vh - 230px) * 5 / 7)); min-width: 200px; }

.reveal { animation: reveal .7s cubic-bezier(.2,.8,.2,1) both; }

.glow .face { box-shadow: 0 0 0 .1em var(--glow), 0 0 1.6em .3em var(--glow); }
/* Rareté : cadre de couleur, étoiles, reflets pour Épique, feuille d'or animée pour Légendaire */
.face-in { position: relative; }
.card.r1 .face { background: linear-gradient(140deg, #5FA383, #2D6448 45%, #3F7D62); }
.card.r2 .face { background: linear-gradient(140deg, #7FA8E8, #2D63B0 40%, #1E4C8F 75%, #4E82D0); }
.card.r3 .face { background: linear-gradient(140deg, #C792DA, #7A3F8F 40%, #5B2C6E 70%, #A66BBE); box-shadow: 0 0 .7em rgba(122,63,143,.55), 0 .15em .5em rgba(10,16,30,.25); }
.card.r4 .face { background: linear-gradient(120deg, #8C6418, #E9C46A 22%, #FFF3C4 35%, #C79A3A 50%, #FFE7A0 66%, #A97B22 82%, #E9C46A); background-size: 260% 260%; animation: foil 4s linear infinite; box-shadow: 0 0 1em rgba(233,196,106,.75), 0 .15em .5em rgba(10,16,30,.25); }
.card.r4 .face-in { box-shadow: inset 0 0 0 .12em #F7DE95; }
.card.r3 .face-in::after, .card.r4 .face-in::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.26) 45%, rgba(255,255,255,.05) 52%, transparent 62%); background-size: 260% 100%; animation: sheen 3.6s ease-in-out infinite; mix-blend-mode: screen; z-index: 3; }
.card.r4 .face-in::after { background: linear-gradient(110deg, transparent 28%, rgba(255,240,190,.45) 44%, rgba(255,255,255,.12) 52%, transparent 64%); background-size: 240% 100%; animation-duration: 2.6s; }
.stars { letter-spacing: .02em; margin-right: .3em; }
.card.r4 .c-band { background: linear-gradient(90deg, #8C6418, #E9C46A, #8C6418) !important; color: #2B1E05; }
@keyframes foil { 0% { background-position: 0% 50%; } 100% { background-position: 260% 50%; } }
@keyframes sheen { 0%, 15% { background-position: 130% 0; } 60%, 100% { background-position: -130% 0; } }

/* Ouverture de paquet */
.opener { position: fixed; inset: 0; z-index: 40; background: radial-gradient(ellipse at 50% 40%, #233A60 0%, #0E1522 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); overflow: hidden; user-select: none; -webkit-user-select: none; }
.op-main { display: flex; align-items: center; justify-content: center; gap: 14px; }
.op-stage { position: relative; width: min(300px, 72vw, calc((100vh - 230px) * 5 / 7)); aspect-ratio: 5 / 7; }
.op-main.withmini .op-stage { width: min(290px, 56vw, calc((100vh - 230px) * 5 / 7)); }
.op-mini { display: none; width: min(180px, 31vw); flex: none; flex-direction: column; gap: 6px; color: var(--white); border: 0; padding: 0; background: none; text-align: left; font: inherit; }
.op-main.withmini .op-mini { display: flex; visibility: hidden; }
.op-main.withmini .op-mini.on { visibility: visible; animation: miniIn .3s ease-out; }
.op-mini canvas { width: 100%; aspect-ratio: 1; border-radius: 10px; box-shadow: 0 0 0 3px var(--green), 0 0 0 4.5px var(--white), 0 8px 20px rgba(0,0,0,.4); background: var(--stone-3); }
.op-mini b { font-family: var(--f-plaque); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.op-mini span { font-size: 12px; opacity: .8; line-height: 1.3; }
@keyframes miniIn { from { opacity: 0; transform: translateX(12px) scale(.94); } to { opacity: 1; transform: none; } }
.op-next { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; color: var(--white); }
.op-next .mpack { position: relative; width: 82px; aspect-ratio: 5 / 7; border: 0; padding: 0; background: none; cursor: pointer; }
.op-next .mpack .bp-top, .op-next .mpack .bp-body { box-shadow: inset 0 0 0 2px #F6F2E8, 0 6px 16px rgba(0,0,0,.4); }
.op-next .mpack .bp-body b { font-size: 26px; }
.op-next .mpack .bp-body small, .op-next .mpack .bp-body span { display: none; }
.op-next .mpack:not([disabled]) { animation: nudge 1.6s ease-in-out infinite; }
.op-next .mpack[disabled] { cursor: default; filter: grayscale(1) brightness(.6); }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateY(-4px) rotate(-2deg); } }
.op-next .t { font-family: var(--f-plaque); font-size: 20px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }

.bonus-note { font-size: 13px; opacity: .9; }
.buy10 { align-self: center; width: calc(100% - 10px); max-width: 360px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--white); color: var(--navy); box-shadow: inset 0 0 0 2px var(--r4); font-family: var(--f-plaque); font-weight: 700; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; }

.op-title { color: var(--white); text-align: center; min-height: 52px; }
.op-title .k { font-family: var(--f-plaque); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .75; }
.op-title .t { font-family: var(--f-plaque); font-size: 28px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; }
.op-row { display: flex; align-items: center; gap: 12px; }
.op-arrow { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(246,242,232,.12); color: var(--white); font-size: 22px; box-shadow: inset 0 0 0 1.5px rgba(246,242,232,.35); }
.op-arrow:disabled { opacity: .25; }
.op-count { color: var(--white); font-family: var(--f-plaque); letter-spacing: .1em; font-size: 15px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

.bpack { position: absolute; inset: 0; animation: bpIn .32s cubic-bezier(.2,1.4,.4,1) both; }
.bp-top, .bp-body { position: absolute; left: 0; right: 0; background: linear-gradient(135deg, #2D63B0, #172B4D 45%, #1F4A36 100%); box-shadow: inset 0 0 0 3px #F6F2E8, 0 10px 30px rgba(0,0,0,.45); }
.bp-top { top: 0; height: 16%; border-radius: 12px 12px 4px 4px; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px), linear-gradient(135deg, #2D63B0, #172B4D); }

.bpack.parigo .bp-top, .bpack.parigo .bp-body { background: linear-gradient(135deg, #E9C46A, #8C6418 45%, #172B4D 100%); }
.bpack.shake { animation: bpShake .26s linear both; }
.bpack.tear .bp-top { animation: bpTop .38s cubic-bezier(.3,.6,.4,1) forwards; }
.bpack.tear .bp-body { animation: bpBody .38s ease-in forwards; }
@keyframes bpIn { from { transform: translateY(40px) scale(.7) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bpShake { 0%, 100% { transform: none; } 20% { transform: rotate(-3deg) translateX(-4px); } 40% { transform: rotate(3deg) translateX(4px); } 60% { transform: rotate(-2deg) translateX(-3px); } 80% { transform: rotate(2deg) translateX(3px); } }
@keyframes bpTop { to { transform: translate(60px, -120px) rotate(28deg); opacity: 0; } }
@keyframes bpBody { to { transform: translateY(70vh); opacity: 0; } }
.ostack { position: absolute; inset: 0; }
.ostack .under { position: absolute; inset: 0; border-radius: 9px; background: var(--green); box-shadow: inset 0 0 0 3px var(--navy), 0 4px 10px rgba(0,0,0,.35); }
.ocard { position: absolute; inset: 0; perspective: 1400px; cursor: pointer; animation: ocIn .22s ease-out both; }
.ocard .oflip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .42s cubic-bezier(.3,.7,.3,1); transform: rotateY(180deg); }
.ocard.up .oflip { transform: none; }
.ocard .pface { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.ocard .pcover { transform: rotateY(180deg); }
.ocard.leave { animation: ocOut .2s ease-in forwards; }
.ocard.back { animation: ocBack .2s ease-out both; }
@keyframes ocIn { from { transform: translateY(14px) scale(.96); } to { transform: none; } }
@keyframes ocOut { to { transform: translateX(-60%) rotate(-10deg); opacity: 0; } }
@keyframes ocBack { from { transform: translateX(-40%) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.ocard .ptag { top: -11px; font-size: 12px; }
.ocard.up.t4 { animation: legend .5s ease-out; }
@keyframes legend { 0% { transform: scale(1); } 35% { transform: scale(1.08) rotate(-1deg); } 100% { transform: scale(1); } }
.oflash { position: absolute; inset: -40%; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, rgba(255,243,196,.95) 0%, rgba(233,196,106,.6) 25%, transparent 60%); animation: flash .6s ease-out forwards; z-index: 5; }
.oflash.epic { background: radial-gradient(circle, rgba(220,180,240,.85) 0%, rgba(122,63,143,.45) 25%, transparent 60%); }
@keyframes flash { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.3); } }
.spark { position: absolute; left: 50%; top: 45%; width: 7px; height: 7px; border-radius: 50%; background: var(--sc, #FFE7A0); box-shadow: 0 0 8px 2px var(--sc, #FFE7A0); pointer-events: none; z-index: 6; animation: spark var(--sd, .8s) cubic-bezier(.15,.7,.3,1) forwards; }
.spark.star { width: 10px; height: 10px; border-radius: 0; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); box-shadow: none; }
@keyframes spark { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.1) rotate(200deg); opacity: 0; } }
.op-summary { width: min(860px, 100%); max-height: calc(100vh - 170px); overflow-y: auto; padding: 12px 4px; }
.tier-label { font-family: var(--f-plaque); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
/* Direction A : lieux à découvrir, titres */
.pend-list { display: flex; flex-direction: column; gap: 4px; }
.pend-row { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; border: 0; background: var(--white); border-radius: 8px; padding: 8px 10px; text-align: left; box-shadow: inset 0 0 0 1px var(--joint); }
.pend-row i { width: 12px; height: 12px; border-radius: 50%; background: var(--white); box-shadow: inset 0 0 0 3px var(--c); }

.pend-row small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.pend-row b { font-family: var(--f-plaque); font-weight: 600; color: var(--green-2); white-space: nowrap; }
.titles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.title-badge { display: inline-block; font-family: var(--f-plaque); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #2B1E05; background: linear-gradient(90deg, #E9C46A, #FFF3C4, #E9C46A); padding: 3px 9px; border-radius: 5px; }
.title-badge.small { font-size: 10.5px; padding: 1px 6px; vertical-align: 1px; }
/* Pastilles de lignes */
.lines { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.lb { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; font-family: var(--f-plaque); font-style: normal; font-weight: 700; font-size: 13px; line-height: 1; box-shadow: 0 0 0 1.5px #F6F2E8; }
.lb.tram, .lb.train { border-radius: 5px; }
.lb.funi { font-size: 10px; }
.lines.on-card { gap: .25em; }
.lines.on-card .lb { min-width: 1.45em; height: 1.45em; padding: 0 .3em; border-radius: .73em; font-size: .78em; box-shadow: 0 0 0 .1em #F6F2E8; }
.lines.on-card .lb.tram, .lines.on-card .lb.train { border-radius: .3em; }
.qname .lb { margin-right: 7px; vertical-align: 1px; }
/* Quêtes */
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qrow { background: var(--white); border-radius: 10px; padding: 11px 13px; box-shadow: inset 0 0 0 1px var(--joint); cursor: pointer; display: flex; flex-direction: column; gap: 7px; }
.qrow.ready { box-shadow: inset 0 0 0 2px var(--r4), 0 0 0 3px rgba(181,134,42,.18); }
.qrow.fin { background: linear-gradient(90deg, #FFF8E2, var(--white)); }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.qname { font-family: var(--f-plaque); font-weight: 700; font-size: 17px; letter-spacing: .03em; color: var(--navy); }
.qcount { font-family: var(--f-plaque); font-weight: 600; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.qbar-p { position: relative; height: 7px; border-radius: 4px; background: rgba(38,34,27,.1); }
.qbar-p b { display: block; height: 100%; border-radius: 4px; background: var(--green-2); max-width: 100%; }
.qrow.fin .qbar-p b { background: var(--r4); }
.qbar-p .tick { position: absolute; top: -2px; width: 3px; height: 11px; margin-left: -1.5px; border-radius: 2px; background: var(--ink-2); opacity: .45; }
.qbar-p .tick.got { background: var(--r4); opacity: 1; }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.qrew { font-family: var(--f-plaque); font-weight: 600; white-space: nowrap; color: var(--green-2); }
.qclaim { background: var(--r4); color: #2B1E05; white-space: nowrap; }
#qSearch { max-width: 360px; }
.qbar { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 9px; background: var(--navy); color: var(--white); box-shadow: 0 0 0 2px var(--green), 0 6px 16px rgba(0,0,0,.25); }
.qbar span { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.qbar b { font-family: var(--f-plaque); font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
.qbar small { font-size: 12px; opacity: .85; }
.qbar .mini-btn { background: var(--white); color: var(--navy); }
.op-hint { color: #F6F2E8; opacity: .85; font-size: 14px; text-align: center; margin: 0 0 12px; }
/* Onglet Paquets : le paquet au centre */
.pk-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: min(52vh, 500px); padding: 6px 0 0; text-align: center; }
.pk-pack { position: relative; isolation: isolate; width: min(46vw, 210px); aspect-ratio: 5 / 7; border: 0; padding: 0; background: none; cursor: pointer; margin-bottom: 10px; -webkit-tap-highlight-color: transparent; }
.pk-pack .bp-top, .pk-pack .bp-body { box-shadow: inset 0 0 0 3px #F6F2E8, 0 14px 30px rgba(10,16,30,.35); }
.pk-pack .bp-body b { font-size: clamp(54px, 17vw, 76px); }
.pk-pack .bp-body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.22) 48%, transparent 60%); background-size: 250% 100%; animation: sheen 2.4s ease-in-out infinite; }
.pk-behind { position: absolute; inset: 0; z-index: -1; border-radius: 12px 12px 14px 14px; background: linear-gradient(135deg, #2D63B0, #172B4D 45%, #1F4A36 100%); box-shadow: inset 0 0 0 3px #F6F2E8, 0 8px 18px rgba(10,16,30,.3); }
.pk-behind.b2 { transform: translate(10px, 8px) rotate(5deg); opacity: .85; }
.pk-behind.b3 { transform: translate(-10px, 10px) rotate(-6deg); opacity: .7; }
.pk-pack:not([disabled]) { animation: pkFloat 2.6s ease-in-out infinite; }
.pk-pack:not([disabled]):active { transform: scale(.96); animation: none; }
.pk-pack[disabled] { cursor: default; filter: grayscale(1) brightness(.85); opacity: .6; }
.pk-pack[disabled] .bp-body::after { animation: none; }
@keyframes pkFloat { 0%, 100% { transform: none; } 50% { transform: translateY(-6px) rotate(-1.2deg); } }
.pk-cta { font-family: var(--f-plaque); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--green-2); }
.pk-pack[disabled] + .pk-cta { color: var(--ink-2); }
.pk-count { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-plaque); color: var(--navy); line-height: 1; }
.pk-count b { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pk-count span { font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.pk-pips { display: flex; gap: 5px; }
.pk-pips i { width: 12px; height: 16px; border-radius: 3px; background: rgba(23,43,77,.1); box-shadow: inset 0 0 0 1.5px rgba(23,43,77,.25); }
.pk-pips i.on { background: var(--green-2); box-shadow: inset 0 0 0 1.5px var(--navy); }
.pk-timer { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-plaque); font-weight: 600; font-size: 18px; letter-spacing: .03em; font-variant-numeric: tabular-nums; color: var(--white); background: var(--navy); padding: 7px 14px; border-radius: 8px; box-shadow: 0 0 0 2.5px var(--green), inset 0 0 0 1.5px var(--white); max-width: 92%; }
.pk-timer svg { flex: none; }
.pk-sub { font-size: 13.5px; color: var(--ink-2); }
.pk-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pk-actions .mini-btn { margin-top: 2px; }
.pk-odds { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 10px; }
.pk-odds .h { font-family: var(--f-plaque); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.pk-odds .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pk-odds .row span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pk-odds .row i { width: 9px; height: 9px; border-radius: 2px; }
#viewPacks .acct { justify-content: center; }
@media (prefers-reduced-motion: reduce) { .pk-pack:not([disabled]), .pk-pack .bp-body::after { animation: none; } }

/* Retournement fiable sur mobile : WebKit et Chrome Android ignorent backface-visibility quand la face contient
   elle-meme de la 3D ou des animations. On bascule donc les faces a mi-course (angle de 90 degres). */
.ocard .pcover, .ocard .pfront { transition: visibility 0s .086s; }
.ocard .pfront, .ocard.up .pcover { visibility: hidden; }
.ocard.up .pfront { visibility: visible; }
.pcard .pcover, .pcard .pfront { transition: visibility 0s .123s; }
.pcard .pfront, .pcard.open .pcover { visibility: hidden; }
.pcard.open .pfront { visibility: visible; }
.card .flip > .face { transition: visibility 0s .123s; }
.card .flip > .face.back, .card.flipped .flip > .face:not(.back) { visibility: hidden; }
.card.flipped .flip > .face.back { visibility: visible; }


/* Boutique */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.offer { border-radius: 10px; padding: 14px; background: var(--white); box-shadow: inset 0 0 0 1.5px var(--joint); display: flex; flex-direction: column; gap: 6px; }
.offer b { font-family: var(--f-plaque); font-size: 22px; color: var(--navy); line-height: 1.05; }
.offer small { color: var(--ink-2); font-size: 12.5px; }
.offer .price { font-family: var(--f-plaque); font-size: 18px; font-weight: 700; color: var(--green-2); }
.offer.hl { box-shadow: inset 0 0 0 2px var(--r4); }
.premium { border-radius: 12px; padding: 18px; color: var(--white); background: linear-gradient(135deg, #172B4D, #1F4A36 60%, #8C6418); box-shadow: 0 0 0 3px var(--r4), inset 0 0 0 1.5px var(--white); display: flex; flex-direction: column; gap: 8px; margin: 3px; }
.premium h3 { color: #F7DE95; margin: 0; }
.premium .big { font-family: var(--f-plaque); font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1; }
.premium ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
.odds { display: grid; grid-template-columns: auto repeat(5, minmax(0, 1fr)); gap: 4px 6px; font-size: 12.5px; align-items: center; }
.odds span { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.odds .h { font-family: var(--f-plaque); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--white); border-radius: 4px; padding: 2px 0; }
.legal { font-size: 11.5px; line-height: 1.5; color: var(--ink-2); }
.badge-pass { display: inline-block; font-family: var(--f-plaque); font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #2B1E05; background: linear-gradient(90deg, #E9C46A, #FFF3C4, #E9C46A); padding: 2px 7px; border-radius: 4px; vertical-align: 2px; }
@media (prefers-reduced-motion: reduce) { .card.r4 .face, .card.r3 .face-in::after, .card.r4 .face-in::after, .bp-body::after { animation: none; } }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); z-index: 30; max-width: min(440px, calc(100vw - 32px)); background: var(--ink); color: var(--white); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: 14px; line-height: 1.35; }
@media (prefers-reduced-motion: reduce) { .card .flip { transition: none; } .reveal { animation: none; } }
</style>

<body>

<div class="app" id="app" data-mobile="map">
  <header class="top">
    <div class="logo" aria-label="Parisquest"><small>Collectionnez Paris</small><strong>Parisquest</strong></div>
    <div class="counters">
      <div class="counter"><b id="cntCards">0</b><span>cartes</span></div>
      <div class="counter"><b id="cntPacks">0</b><span id="cntNext">paquets</span></div>
      <button class="counter" id="cntEcusBtn" style="border:0;font:inherit" aria-label="Boutique"><b id="cntEcus">0</b><span>PQ</span></button>
    </div>
  </header>

  <main class="main">
    <section class="map-wrap" id="mapWrap" aria-label="Carte de Paris">
      <canvas id="map" role="img" aria-label="Plan de Paris avec les lieux à collectionner"></canvas>
      <div class="loading" id="loading">Chargement de Paris…</div>
      <div class="map-top">
        <div class="testbar" id="testbar">
          <button class="switch" id="testToggle" aria-pressed="true"><i></i>Mode test</button>
          <span class="hint" id="testHint">Touchez la carte pour vous déplacer.</span>
          <button class="mini-btn" id="nextDay">Jour suivant</button>
          <button class="mini-btn ghost" id="gpsBtn">GPS</button>
        </div>
        <div class="layers" id="layers" role="group" aria-label="Familles affichées"></div>
        <div class="qbar" id="qbar" hidden></div>
        <div class="scalebar"><span id="scaleLabel">500 m</span><i id="scaleBar" style="width:60px"></i></div>
      </div>
      <div class="tools">
        <button class="tool" id="zoomIn" aria-label="Zoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="tool" id="zoomOut" aria-label="Dézoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="tool" id="meBtn" aria-label="Centrer sur ma position"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        <button class="tool" id="fitBtn" aria-label="Voir tout Paris"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="sheet" id="sheet" aria-live="polite"><div class="sheet-text"><div class="eyebrow">Parisquest</div><h2>Chargement</h2><p>Préparation des 15 000 lieux de Paris.</p></div></div>
    </section>

    <aside class="side" id="side">
      <div class="side-tabs" id="sideTabs"></div>
      <section class="view" id="viewCollection"></section>
      <section class="view" id="viewPacks" hidden></section>
      <div id="moreViews"></div>
    </aside>
  </main>

  <nav class="tabbar" aria-label="Navigation">
    <button data-tab="map" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Carte</button>
    <button data-tab="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M17 6.5 20.5 8 17 19"/></svg>Collection</button>
    <button data-tab="packs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="7" width="12" height="14" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v12"/></svg><span>Paquets<span class="badge" id="packBadge" hidden>0</span></span></button>

let SB = null;

  SB.auth.onAuthStateChange((ev, session) => { setUser(session && session.user); });

  if (!SB || !ui.user || !ui.ready) return;
  const owned = {}, pending = {};
  for (let from = 0; ; from += 1000) {
    const { data, error } = await SB.from("user_cards").select("place_id,copies,level,visits,first_at,last_visit,pending").order("place_id").range(from, from + 999);
    if (error) { toast("Synchronisation impossible. Réessayez plus tard."); return; }
    for (const r of data) { const it = BYID.get(r.place_id); if (!it) continue; if (r.pending) pending[r.place_id] = { at: Date.parse(r.first_at) }; else owned[r.place_id] = { tier: it.t, lvl: r.level, copies: r.copies, vis: r.visits, last: r.last_visit, at: Date.parse(r.first_at) }; }
    if (data.length < 1000) break;
  }

}

/* ----- Bataille ----- */
/* Puissance d'une carte : rareté, niveau, visite, exemplaires. */
function power(it) { const o = S.owned[it.i]; const t = o ? o.tier : it.t; return 10 + t * 15 + ((o && o.lvl) || 1) * 6 - 6 + (o && o.vis ? 8 : 0) + Math.min(((o && o.copies) || 1) - 1, 4) * 2; }
const FAM_KEYS = () => Object.keys(FAMS);
const BAT = { terrains: null, diff: 1, result: null, picking: false };
function newTerrains() { const F = FAM_KEYS(); BAT.terrains = Array.from({ length: 5 }, () => F[Math.floor(rnd() * F.length)]); BAT.result = null; }
const roundPower = (it, terr, botTier) => { const base = it.bot ? 10 + it.t * 15 + it.lvl * 6 - 6 : power(it); return Math.round(base * (famOf(it) === terr ? 1.3 : 1)); };
function botDeck(diff) {
  const mine = S.deck.map(id => BYID.get(id)).filter(Boolean);
  const avg = mine.length ? mine.reduce((n, it) => n + S.owned[it.i].tier, 0) / mine.length : 1;
  return Array.from({ length: 5 }, () => {
    const t = Math.max(0, Math.min(4, Math.round(avg + (diff - 1) * .8 + (rnd() - .5) * 1.6)));
    const pool = TIER_POOL[t]; const it = ITEMS[pool[Math.floor(rnd() * pool.length)]];
    return Object.assign(Object.create(it), { bot: true, lvl: 1 + Math.floor(rnd() * (diff + 2)) });
  });
}
function bestDeck() {
  const list = Object.keys(S.owned).map(id => BYID.get(id)).filter(Boolean);
  const used = new Set(), deck = [];
  for (const terr of BAT.terrains) { let best = null, bp = -1; for (const it of list) { if (used.has(it.i)) continue; const p = roundPower(it, terr); if (p > bp) { bp = p; best = it; } } if (best) { used.add(best.i); deck.push(best.i); } }
  S.deck = deck; save();
}
function fight() {
  const me = S.deck.map(id => BYID.get(id)).filter(Boolean); if (me.length < 5) { toast("Il faut 5 cartes dans le deck."); return; }
  const op = botDeck(BAT.diff);
  const rounds = BAT.terrains.map((terr, i) => { const a = roundPower(me[i], terr), b = roundPower(op[i], terr); const win = a > b || (a === b && rnd() < .5); return { terr, me: me[i], op: op[i], a, b, win }; });
  const w = rounds.filter(r => r.win).length, won = w >= 3;
  if (won) S.stats.won += 1; else S.stats.lost += 1;
  BAT.result = { rounds, w, won };
  const am = checkAchievements(); save(); refreshAll(); if (am.length) toast(am.join(" · "));
  newTermsAfter = true;
}
let newTermsAfter = false;

  if (!ui.ready) return;
  if (!BAT.terrains) newTerrains();
  const owned = Object.keys(S.owned).length;
  S.deck = S.deck.filter(id => S.owned[id]).slice(0, 5);

  viewEl("battle").innerHTML = `<h2>Bataille</h2>

    <div class="panel"><h3>Terrains annoncés</h3><div class="terrains">${BAT.terrains.map((f, i) => `<span class="terrain" style="--c:${FAMS[f].color}"><i></i>${i + 1}. ${esc(FAMS[f].name)}</span>`).join("")}</div>
      <div class="btn-row" style="margin-top:10px"><button class="mini-btn ghost" id="batNewT">Autres terrains</button><button class="mini-btn ghost" id="batBest">Deck conseillé</button></div></div>
    <div class="panel"><h3>Votre deck</h3><div class="deck">${[0, 1, 2, 3, 4].map(i => { const it = deck[i], terr = BAT.terrains[i];
      return it ? `<div class="dslot" style="--c:${famColor(it)}"><span class="n">${i + 1}</span><span><strong>${esc(it.n)}</strong><small>${esc(FAMS[famOf(it)].name)} · ${TIERS[S.owned[it.i].tier]} · puissance ${roundPower(it, terr)}${famOf(it) === terr ? " (terrain +30 %)" : ""}</small></span><span class="acts"><button data-up="${i}" aria-label="Monter">↑</button><button data-down="${i}" aria-label="Descendre">↓</button><button data-rm="${i}" aria-label="Retirer">×</button></span></div>`

      ${deck.length < 5 ? `<div id="deckPick"></div>` : ""}

  const root = viewEl("battle");
  root.querySelectorAll("[data-diff]").forEach(b => b.onclick = () => { BAT.diff = +b.dataset.diff; renderBattle(); });
  if (!$("batNewT")) return;

  root.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { S.deck.splice(+b.dataset.rm, 1); save(); renderBattle(); });
  if ($("deckPick")) cardPicker($("deckPick"), id => { if (S.deck.length < 5 && !S.deck.includes(id)) { S.deck.push(id); save(); renderBattle(); } }, new Set(S.deck));
  $("fightBtn").onclick = () => { fight(); renderBattle(); if (newTermsAfter) { newTermsAfter = false; BAT.terrains = BAT.terrains; } };
  if (R && $("fightBtn")) $("fightBtn").textContent = "Rejouer (mêmes terrains)";
  if (SOCIAL()) renderPvp();
}

    if (!ui.user) { toast("Connectez-vous d'abord (onglet Paquets)."); return; }

  if (!DEMO_BUY) { toast("Les achats ouvriront au lancement du jeu."); return; }

const capFirst = m => { m = String(m || "Erreur du serveur").replace(/^ERROR:\s*/, ""); return m.charAt(0).toUpperCase() + m.slice(1); };
async function rpc2(fn, args) {
  if (!SOCIAL()) { toast("Connectez-vous d'abord (onglet Paquets)."); return [false]; }
  const { data, error } = await SB.rpc(fn, args || {});
  if (error) { toast(capFirst(error.message)); if (/carte non disponible|ne possédez pas/.test(error.message)) syncServer(); return [false]; }
  return [true, data];
}
const nameOf = id => (BYID.get(id) || { n: "Carte inconnue" }).n;

const timeLeft = ms => { if (ms <= 0) return "terminé"; const m = Math.floor(ms / 60000); if (m < 60) return `${m} min`; const h = Math.floor(m / 60); return h < 24 ? `${h} h ${m % 60} min` : `${Math.floor(h / 24)} j ${h % 24} h`; };
async function socialGate(id) {

// Badges (demandes d'amis, messages non lus, échanges reçus), messages en direct
async function socialPoll() {
  if (!SOCIAL()) return;
  const [a, b, c] = await Promise.all([SB.rpc("friends_list"), SB.rpc("conversations"), SB.rpc("my_trades")]);
  if (!a.error) SOC.friends = a.data; if (!b.error) SOC.convs = b.data;
  if (!c.error) {
    // une de mes propositions acceptée par un ami : la collection a changé, on la relit
    const acc = c.data.filter(t => t.status === "accepted").map(t => t.id).join(",");
    if (SOC.accSeen != null && acc !== SOC.accSeen) syncServer();
    SOC.accSeen = acc; SOC.trades = c.data;
  }
  const uid = ui.user.id;
  SOC.badges = {
    friends: (SOC.friends && SOC.friends.incoming.length) || 0,
    messages: (SOC.convs || []).reduce((n, x) => n + (+x.unread || 0), 0),
    trades: (SOC.trades || []).filter(t => t.status === "open" && t.to === uid).length,
  };
  SOC.badges.quests = QUESTS.length ? claimable() : 0;
  const tot = SOC.badges.friends + SOC.badges.messages + SOC.badges.trades + SOC.badges.quests;
  $("menuBadge").hidden = !tot; $("menuBadge").textContent = tot;
  if (ui.view === "menu") renderMenu();
  if (!SOC.chan && SB.channel) {
    SOC.chan = SB.channel("pq-dm").on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `recipient=eq.${uid}` }, pl => {
      const m = pl.new;
      if (ui.view === "messages" && SOC.threadWith === m.sender) { SOC.thread = (SOC.thread || []).concat([m]); drawThread(); SB.rpc("dm_thread", { p_other: m.sender }); }
      else { const who = ((SOC.friends && SOC.friends.friends) || []).find(f => f.id === m.sender); toast(`Message de ${who ? who.pseudo : "un ami"} : ${m.body.slice(0, 60)}`); socialPoll(); }
    }).subscribe();
  }
}
setInterval(() => { if (SOCIAL() && !document.hidden) socialPoll(); }, 60000);

    body = `<div class="filters"><input type="search" id="mkQ" placeholder="Rechercher une carte" value="${esc(SOC.mkQ)}">
        <select id="mkFam"><option value="">Toutes les familles</option>${Object.entries(FAMS).map(([k, f]) => `<option value="${k}" ${SOC.mkFam === k ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select>
        <select id="mkTier"><option value="">Toutes les raretés</option>${TIERS.map((n, i) => `<option value="${i}" ${SOC.mkTier === String(i) ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      ${L.length ? `<div class="mk-grid" style="margin-top:10px">${L.map(l => { const it = BYID.get(l.place), left = Date.parse(l.ends_at) - now();
        return `<div class="mk-item">${cardHTML(it)}<div class="mk-info"><b>${nf(l.bid || l.start)} PQ</b> ${l.bid ? `· ${l.bids} enchère${l.bids > 1 ? "s" : ""}` : "· prix de départ"}<br>${timeLeft(left)} · ${esc(l.seller)}${l.leading ? `<br><span class="lead">Vous menez</span>` : ""}${l.buyout ? `<br>Achat immédiat : ${nf(l.buyout)}` : ""}</div>
          ${l.mine ? (l.bid ? `<small>Votre vente</small>` : `<button class="mini-btn ghost" data-cancel="${l.id}">Annuler la vente</button>`) : `<div class="mk-act">${l.leading ? "" : `<input class="field" type="number" min="${l.min}" value="${l.min}" id="bid${l.id}"><button class="mini-btn" data-bid="${l.id}">Enchérir</button>`}</div>${l.buyout ? `<button class="mini-btn ghost" data-buy="${l.id}">Acheter ${nf(l.buyout)}</button>` : ""}`}</div>`; }).join("")}</div>` : `<div class="empty" style="margin-top:10px">Aucune carte en vente pour ces critères.</div>`}`;
  } else if (SOC.mkTab === "sell") {
    const it = SOC.mkSel && BYID.get(SOC.mkSel), o = it && S.owned[it.i];
    body = it && o ? `<div style="display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start">${cardHTML(it)}<div style="display:flex;flex-direction:column;gap:8px">
        <label>Prix de départ (PQ)<input class="field" type="number" id="slStart" min="1" value="${[20, 40, 80, 160, 400][it.t]}"></label>
        <label>Achat immédiat (facultatif)<input class="field" type="number" id="slBuy" min="2" placeholder="aucun"></label>
        <label>Durée<select class="field" id="slHours"><option value="1">1 heure</option><option value="24" selected>24 heures</option><option value="72">3 jours</option></select></label>
        ${(o.copies || 1) <= 1 ? `<p class="warn">C'est votre dernier exemplaire : la carte quittera votre collection${o.vis ? " avec son niveau et son sceau « Visité »" : ""}.</p>` : `<p class="lede" style="font-size:13px">Il vous restera ${o.copies - 1} exemplaire${o.copies - 1 > 1 ? "s" : ""}.</p>`}
        <div class="btn-row"><button class="btn" id="slGo">Mettre en vente</button><button class="mini-btn ghost" id="slOther">Autre carte</button></div></div></div>
        <p class="lede" style="font-size:13px;margin-top:8px">La carte est mise de côté pendant la vente. 5 % du prix de vente sont prélevés. Sans enchère, elle vous revient à la fin.</p>`
      : `<p class="lede" style="font-size:14px">Choisissez la carte à vendre :</p><div id="slPick"></div>`;
  } else {
    body = d.history.length ? d.history.map(h => `<div class="prow"><span>${chipHTML(h.place)}<small>${h.mine ? (h.status === "sold" ? `Vendue ${nf(h.price)} PQ (vous recevez ${nf(Math.floor(h.price * .95))})` : h.status === "unsold" ? "Invendue, carte récupérée" : "Vente annulée") : `Remportée pour ${nf(h.price)} PQ`}</small></span><small>${new Date(h.closed_at).toLocaleDateString("fr-FR")}</small></div>`).join("")
      : `<div class="empty">Pas encore de vente ni d'achat.</div>`;
    const mine = d.open.filter(l => l.mine || l.leading);
    if (mine.length) body = `<h3 style="margin-top:4px">En cours</h3>${mine.map(l => `<div class="prow"><span>${chipHTML(l.place)}<small>${l.mine ? "Votre vente" : "Vous menez"} · ${nf(l.bid || l.start)} PQ · ${timeLeft(Date.parse(l.ends_at) - now())}</small></span></div>`).join("")}<h3 style="margin-top:12px">Terminées</h3>` + body;
  }
  el.innerHTML = `<h2>Marché</h2>
    <p class="lede">Solde : <b>${nf(d.ecus || 0)} PQ</b>. Les PQ d'une enchère sont mis de côté et rendus si quelqu'un surenchérit. Une enchère dans les 2 dernières minutes prolonge la vente.</p>
    <div class="tabsrow">${tabs.map(([k, n]) => `<button class="mini-btn${SOC.mkTab === k ? "" : " ghost"}" data-tab2="${k}">${n}</button>`).join("")}</div>
    <div class="panel">${body}</div>`;
  el.querySelectorAll("[data-tab2]").forEach(b => b.onclick = () => { SOC.mkTab = b.dataset.tab2; renderMarket(); });
  const done = async (msg) => { toast(msg); await afterCardMove(); renderMarket(); };
  if ($("mkQ")) { $("mkQ").oninput = e => { SOC.mkQ = e.target.value; clearTimeout(SOC.mkT); SOC.mkT = setTimeout(renderMarket, 350); }; $("mkFam").onchange = e => { SOC.mkFam = e.target.value; renderMarket(); }; $("mkTier").onchange = e => { SOC.mkTier = e.target.value; renderMarket(); }; }
  el.querySelectorAll("[data-bid]").forEach(b => b.onclick = async () => { const [ok2] = await rpc2("place_bid", { p_id: +b.dataset.bid, p_amount: +$("bid" + b.dataset.bid).value }); if (ok2) done("Enchère placée : vous menez."); });
  el.querySelectorAll("[data-buy]").forEach(b => b.onclick = async () => { const [ok2] = await rpc2("buy_now", { p_id: +b.dataset.buy }); if (ok2) done("Carte achetée : elle est dans votre collection."); });
  el.querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => { const [ok2] = await rpc2("cancel_listing", { p_id: +b.dataset.cancel }); if (ok2) done("Vente annulée : la carte vous revient."); });
  if ($("slPick")) cardPicker($("slPick"), id => { SOC.mkSel = id; renderMarket(); });
  if ($("slOther")) $("slOther").onclick = () => { SOC.mkSel = null; renderMarket(); };
  if ($("slGo")) $("slGo").onclick = async () => {
    const buy = $("slBuy").value ? +$("slBuy").value : null;
    const [ok2] = await rpc2("create_listing", { p_place: SOC.mkSel, p_start: +$("slStart").value, p_buyout: buy, p_hours: +$("slHours").value });
    if (ok2) { SOC.mkSel = null; SOC.mkTab = "mine"; done("Carte mise en vente."); }
  };
}

/* ----- Classement ----- */
async function renderLeaderboard() {
  const el = viewEl("leaderboard");
  const rules = `<p class="credits">Score : Commune 1 point, Peu commune 2, Rare 5, Épique 15, Légendaire 50, doublés quand la carte a été capturée ou visitée sur place. Les lieux à découvrir ne comptent pas encore.</p>`;
  if (!SOCIAL()) {
    el.innerHTML = `<h2>Classement</h2><div class="panel"><h3>Votre score</h3><p class="lede"><b>${nf(score())}</b> points · ${nf(Object.keys(S.owned).length)} cartes</p></div>
      <div class="panel"><p class="lede" style="font-size:14px">${SB_CONF ? "Connectez-vous (onglet Paquet) pour vous comparer aux autres collectionneurs de Paris et de votre arrondissement." : "Le classement des collectionneurs arrive avec la version en ligne."}</p></div>${rules}`;
    return;
  }
  if (!(await socialGate("leaderboard"))) return;
  SOC.lbScope = SOC.lbScope || "paris";
  if (!SOC.lbArr) { const P = proj(S.pos.lat, S.pos.lon); let best = null, bd = Infinity; for (const i of candidates(P[0], P[1], CELL * 2)) { const it = ITEMS[i]; if (!it.r) continue; const d = distTo(it, P); if (d < bd) { bd = d; best = it; } } SOC.lbArr = best ? +best.r : 1; }
  const T = [["paris", "Paris"], ["arr", "Arrondissement"], ["friends", "Amis"], ["masters", "Maîtres"], ["quests", "Quêtes"]];
  const head = `<h2>Classement</h2><div class="tabsrow">${T.map(([k, n]) => `<button class="mini-btn${SOC.lbScope === k ? "" : " ghost"}" data-k="${k}">${n}</button>`).join("")}</div>`;
  const ord = a => `${a}<sup>${a === 1 ? "er" : "e"}</sup>`;
  if (SOC.lbScope === "quests") {
    const [ok, d] = await rpc2("quest_leaders"); if (!ok) return;
    el.innerHTML = `${head}${d.me ? `<p class="lede" style="margin-top:4px">Vous êtes <b>${ord(d.me.rank)}</b> sur ${nf(d.players)}, avec ${nf(d.me.steps)} palier${d.me.steps > 1 ? "s" : ""} et ${nf(d.me.done)} quête${d.me.done > 1 ? "s" : ""} terminée${d.me.done > 1 ? "s" : ""}.</p>` : `<p class="lede" style="margin-top:4px">Récupérez un premier palier dans l'onglet Quêtes pour entrer au classement.</p>`}
      <div class="panel"><div class="lb-table">${d.top.map(r => `<div class="lb-row${r.me ? " me" : ""}"><b>${r.rank}</b><span>${esc(r.pseudo)}<small style="display:block;color:var(--ink-2);font-size:12px">${nf(r.done)} quête${r.done > 1 ? "s" : ""} terminée${r.done > 1 ? "s" : ""}</small></span><b>${nf(r.steps)}</b></div>`).join("") || `<div class="empty">Personne pour l'instant : soyez le premier.</div>`}</div></div>`;
  } else if (SOC.lbScope === "masters") {
    const [ok, m] = await rpc2("arr_masters"); if (!ok) return;
    const by = Object.fromEntries((m || []).map(x => [x.arr, x]));
    el.innerHTML = `${head}<p class="lede" style="margin-top:4px">Le premier collectionneur de chaque arrondissement en est le Maître.</p>
      <div class="panel"><div class="lb-table">${Array.from({ length: 20 }, (_, i) => i + 1).map(a => { const x = by[a]; return `<div class="lb-row${x && x.me ? " me" : ""}"><b>${ord(a)}</b><span>${x ? esc(x.pseudo) : `<em style="color:var(--ink-2)">Libre : soyez le premier</em>`}</span><b>${x ? nf(x.score) : ""}</b></div>`; }).join("")}</div></div>${rules}`;
  } else {
    const args = SOC.lbScope === "arr" ? { p_scope: "arr", p_arr: SOC.lbArr } : { p_scope: SOC.lbScope };
    const [ok, d] = await rpc2("collectors", args); if (!ok) return;
    const where = SOC.lbScope === "arr" ? `du ${ord(SOC.lbArr)}` : SOC.lbScope === "friends" ? "entre amis" : "de Paris";
    el.innerHTML = `${head}
      ${SOC.lbScope === "arr" ? `<select class="field" id="lbArr" aria-label="Arrondissement" style="max-width:220px">${Array.from({ length: 20 }, (_, i) => i + 1).map(a => `<option value="${a}" ${a === SOC.lbArr ? "selected" : ""}>${a === 1 ? "1er" : a + "e"} arrondissement</option>`).join("")}</select>` : ""}
      ${d.me ? `<p class="lede" style="margin-top:4px">Vous êtes <b>${ord(d.me.rank)}</b> ${where} sur ${nf(d.players)} collectionneur${d.players > 1 ? "s" : ""}, avec ${nf(d.me.score)} points.${SOC.lbScope === "arr" && d.me.rank === 1 && d.me.score > 0 ? ` Vous êtes le Maître du ${ord(SOC.lbArr)}.` : ""}</p>` : ""}
      <div class="panel"><div class="lb-table">${d.top.map(r => `<div class="lb-row${r.me ? " me" : ""}"><b>${r.rank}</b><span>${esc(r.pseudo)}${SOC.lbScope === "arr" && r.rank === 1 && r.score > 0 ? ` <span class="title-badge small">Maître</span>` : ""}<small style="display:block;color:var(--ink-2);font-size:12px">${nf(r.cards)} carte${r.cards > 1 ? "s" : ""} · ${nf(r.visited)} visitée${r.visited > 1 ? "s" : ""}</small></span><b>${nf(r.score)}</b></div>`).join("") || `<div class="empty">Personne pour l'instant : soyez le premier.</div>`}</div></div>${rules}`;
    if ($("lbArr")) $("lbArr").onchange = e => { SOC.lbArr = +e.target.value; renderLeaderboard(); };
  }
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { SOC.lbScope = b.dataset.k; renderLeaderboard(); });
}

/* ----- Guilde ----- */
async function renderGuild() {
  const el = viewEl("guild"); if (!(await socialGate("guild"))) return;
  const [ok, g] = await rpc2("guild_info"); if (!ok) return; SOC.guild = g;
  if (!g) {
    const [o2, list] = await rpc2("guild_search", { p_q: "" }); if (!o2) return;
    el.innerHTML = `<h2>Guilde</h2><p class="lede">Collectionnez Paris en équipe : jusqu'à 20 membres, une collection commune et un objectif chaque semaine.</p>
      <div class="panel"><h3>Créer une guilde</h3><div style="display:grid;gap:8px"><input class="field" id="gName" maxlength="30" placeholder="Nom (3 à 30 caractères)"><input class="field" id="gTag" maxlength="5" placeholder="Sigle (2 à 5 lettres ou chiffres)"><input class="field" id="gDesc" maxlength="200" placeholder="Description (facultatif)"><button class="btn" id="gCreate">Créer</button></div></div>
      <div class="panel"><h3>Rejoindre une guilde</h3>${list.length ? list.map(x => `<div class="prow"><span><strong>${esc(x.name)} [${esc(x.tag)}]</strong><small>${x.members}/20 membres${x.description ? " · " + esc(x.description) : ""}</small></span><span class="acts"><button class="mini-btn" data-join="${x.id}" ${x.members >= 20 ? "disabled" : ""}>Rejoindre</button></span></div>`).join("") : `<div class="empty">Aucune guilde pour l'instant : créez la première.</div>`}</div>`;
    $("gCreate").onclick = async () => { const [o3] = await rpc2("guild_create", { p_name: $("gName").value, p_tag: $("gTag").value, p_description: $("gDesc").value }); if (o3) { toast("Guilde créée."); renderGuild(); } };
    el.querySelectorAll("[data-join]").forEach(b => b.onclick = async () => { const [o3] = await rpc2("guild_join", { p_id: +b.dataset.join }); if (o3) { toast("Bienvenue dans la guilde."); renderGuild(); } });
    return;
  }
  const me = ui.user.id, chef = g.my_role === "chef", off = g.my_role === "officier";
  const cov = g.coverage / g.total * 100, wk = Math.min(100, g.week_visits / g.week_goal * 100);
  el.innerHTML = `<h2>Guilde</h2>
    <div class="panel"><h3>${esc(g.name)} [${esc(g.tag)}]</h3>${g.description ? `<p class="lede" style="font-size:14px">${esc(g.description)}</p>` : ""}
      <div class="stats" style="margin-top:8px"><div class="stat"><b>${g.members.length}/20</b><span>membres</span></div><div class="stat"><b>${cov.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} %</b><span>de Paris collectionné ensemble (${nf(g.coverage)} lieux)</span></div><div class="stat"><b>${g.week_visits}/${g.week_goal}</b><span>visites cette semaine</span></div></div>
      <div class="ach"><strong>Objectif de la semaine</strong><span class="lv">${g.week_visits >= g.week_goal ? "Atteint" : `${g.week_goal - g.week_visits} visites restantes`}</span><p>${g.week_goal} visites sur place par les membres, du lundi au dimanche.</p><span class="bar"><i style="width:${wk}%"></i></span></div></div>
    <div class="panel"><h3>Membres</h3>${g.members.map(m => `<div class="prow"><span><strong>${esc(m.pseudo)}</strong><small>${m.role} · ${nf(m.cards)} cartes</small></span><span class="acts">${m.id === me ? "" : `${chef ? `${m.role !== "officier" ? `<button class="mini-btn ghost" data-role="${m.id}" data-r="officier">Officier</button>` : `<button class="mini-btn ghost" data-role="${m.id}" data-r="membre">Membre</button>`}<button class="mini-btn ghost" data-role="${m.id}" data-r="chef">Nommer chef</button>` : ""}${chef || (off && m.role === "membre") ? `<button class="mini-btn ghost" data-kick="${m.id}">Exclure</button>` : ""}`}</span></div>`).join("")}</div>
    <div class="panel"><h3>Discussion</h3><div class="bubbles" id="gChat">${g.messages.map(m => `<div class="bubble${m.mine ? " me" : ""}">${m.mine ? "" : `<b>${esc(m.pseudo)}</b>`}${esc(m.body)}<small>${new Date(m.at).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</small></div>`).join("") || `<div class="empty">Lancez la discussion.</div>`}</div>
      <div class="sendrow"><input class="field" id="gIn" maxlength="500" placeholder="Message à la guilde"><button class="btn small" id="gSend">Envoyer</button></div></div>
    <button class="mini-btn ghost" id="gLeave" style="align-self:flex-start">Quitter la guilde</button>`;
  const box = $("gChat"); box.scrollTop = box.scrollHeight;
  const send = async () => { const v = $("gIn").value.trim(); if (!v) return; const [o3] = await rpc2("guild_send", { p_body: v }); if (o3) renderGuild(); };
  $("gSend").onclick = send; $("gIn").onkeydown = e => { if (e.key === "Enter") send(); };
  $("gLeave").onclick = async () => { const [o3, r] = await rpc2("guild_leave"); if (o3) { toast(capFirst(r)); renderGuild(); } };
  el.querySelectorAll("[data-kick]").forEach(b => b.onclick = async () => { const [o3] = await rpc2("guild_kick", { p_user: b.dataset.kick }); if (o3) renderGuild(); });
  el.querySelectorAll("[data-role]").forEach(b => b.onclick = async () => { const [o3] = await rpc2("guild_set_role", { p_user: b.dataset.role, p_role: b.dataset.r }); if (o3) renderGuild(); });
  if (!SOC.gchan && SB.channel) SOC.gchan = SB.channel("pq-guild").on("postgres_changes", { event: "INSERT", schema: "public", table: "guild_messages", filter: `guild_id=eq.${g.id}` }, () => { if (ui.view === "guild") renderGuild(); }).subscribe();
}

/* ----- Bataille contre un ami ----- */
async function renderPvp() {
  const box = $("pvp"); if (!box) return;
  if (!SOC.profile || !SOC.profile.pseudo) { box.innerHTML = `<h3>Contre un ami</h3><p class="lede" style="font-size:14px">Choisissez d'abord un pseudo dans l'onglet Amis.</p>`; return; }
  const [[o1, h], [o2, f]] = await Promise.all([rpc2("battle_history"), rpc2("friends_list")]); if (!o1 || !o2) return;
  const ready = S.deck.length === 5, fr = f.friends;
  box.innerHTML = `<h3>Contre un ami</h3>
    <p class="lede" style="font-size:14px">Bilan : ${h.wins} victoire${h.wins > 1 ? "s" : ""}, ${h.losses} défaite${h.losses > 1 ? "s" : ""}. Votre deck de défense : ${h.defense ? h.defense.map(id => chipHTML(id)).join(" ") : "aucun"}.</p>
    <button class="mini-btn" id="pvpDef" ${ready ? "" : "disabled"} style="margin-top:6px">Mon deck actuel devient ma défense</button>
    <div style="margin-top:10px">${fr.length ? fr.map(x => `<div class="prow"><span><strong>${esc(x.pseudo)}</strong><small>${x.defense ? "défense prête" : "pas encore de défense"}</small></span><span class="acts"><button class="mini-btn" data-ch="${x.id}" ${x.defense && ready ? "" : "disabled"}>Défier</button></span></div>`).join("") : `<div class="empty">Ajoutez des amis pour les défier.</div>`}</div>
    ${h.last.length ? `<h3 style="margin-top:12px">Derniers combats</h3>${h.last.slice(0, 8).map(b => `<div class="prow"><span><strong>${b.victory ? "Victoire" : "Défaite"} ${b.score}-${5 - b.score}</strong><small>${b.attack ? "attaque" : "défense"} contre ${esc(b.opponent)}</small></span><small>${new Date(b.at).toLocaleDateString("fr-FR")}</small></div>`).join("")}` : ""}`;
  $("pvpDef").onclick = async () => { const [ok] = await rpc2("set_defense", { p_cards: S.deck }); if (ok) { toast("Deck de défense enregistré."); renderPvp(); } };
  box.querySelectorAll("[data-ch]").forEach(b => b.onclick = async () => {
    const [ok, r] = await rpc2("challenge", { p_friend: b.dataset.ch, p_cards: S.deck }); if (!ok) return;
    BAT.result = { w: r.won, won: r.victory, vs: r.opponent, rounds: r.rounds.map(x => ({ terr: x.terrain, me: BYID.get(x.me) || { n: "?" }, op: BYID.get(x.op) || { n: "Carte vendue" }, a: x.a, b: x.b, win: x.win })) };
    if (r.victory) S.stats.won += 1; else S.stats.lost += 1; save(); renderBattle();
  });
}

};
function renderServerView(id) {
  const t = SRV_TEXT[id], sec = SEC[id], st = collStats();
  viewEl(id).innerHTML = `<h2>${esc(sec.name)}</h2>
    <p class="lede">${esc(t.lede)} ${srvBadge}</p>
    <div class="panel"><h3>Comment ça marchera</h3><ul class="rules">${t.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>
    ${id === "leaderboard" ? `<div class="panel"><h3>Votre ligne</h3><div class="lb-row"><b>–</b><span>${esc(S.profile.name || "Vous")}<small style="display:block;color:var(--ink-2);font-size:12px">${nf(st.cards)} cartes · ${nf(st.tiers[4])} Légendaires · ${nf(st.visited)} visites · ${nf(S.stats.won)} victoires</small></span><b>${nf(ecus())}</b></div></div>` : ""}
    <div class="empty">Cette section s'active dès que le serveur est branché : elle a besoin des comptes joueurs pour relier les collections entre elles.</div>`;
}

/* ---------- Navigation ---------- */
function setMobile(m) {
  ui.mobile = m === "map" ? "map" : "panel"; if (m !== "map") setView(m);
  $("app").dataset.mobile = ui.mobile;
  const tabOf = v => v === "collection" || v === "packs" ? v : "menu";
  document.querySelectorAll(".tabbar button").forEach(b => { const on = (b.dataset.tab === "map" && ui.mobile === "map") || (ui.mobile === "panel" && b.dataset.tab === tabOf(ui.view)); if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (ui.mobile === "map") requestAnimationFrame(resize);
}
function setView(view) {
  if (!RENDER[view]) view = "collection";
  ui.view = view; ui.resetArmed = false;
  document.querySelectorAll("#side .view").forEach(el => { el.hidden = el !== viewEl(view); });
  document.querySelectorAll(".side-tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  RENDER[view](); $("side").scrollTop = 0;
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => setMobile(b.dataset.tab));
document.querySelectorAll(".side-tabs button").forEach(b => b.onclick = () => setView(b.dataset.view));

/* ---------- Mode test, jour suivant, GPS ---------- */
function renderTestbar() { $("testbar").hidden = !TEST_ALLOWED; $("testToggle").setAttribute("aria-pressed", String(S.test)); $("testHint").textContent = S.test ? "Touchez la carte pour vous déplacer." : "Position GPS réelle."; $("nextDay").hidden = !S.test; }
$("testToggle").onclick = () => { if (S.test) { startGPS(); return; } stopGPS(); S.test = true; renderTestbar(); renderSheet(); };
$("gpsBtn").onclick = startGPS;
$("nextDay").onclick = () => { S.dayOffset += 1; save(); refreshAll(); toast("Un jour passe : vos cartes peuvent à nouveau être visitées pour monter de niveau."); };
function gpsFail(msg) {
  stopGPS();
  if (TEST_ALLOWED) { S.test = true; ui.gps = "off"; renderTestbar(); toast(HOSTED ? msg : "Le GPS n'est pas disponible ici. Ouvrez la version hébergée sur votre téléphone, ou restez en mode test."); }
  else { ui.gps = "denied"; toast(msg); }
  renderSheet(); render();
}
function startGPS() {
  if (!("geolocation" in navigator)) { gpsFail("Ce navigateur ne donne pas accès à la position."); return; }
  if (ui.gpsWatch != null) return;
  ui.gps = "wait"; renderSheet();
  try {
    ui.gpsWatch = navigator.geolocation.watchPosition(p => {
      const { latitude: la, longitude: lo, accuracy } = p.coords;
      ui.acc = accuracy; const first = ui.gps !== "ok"; ui.gps = "ok";
      if (S.test) { S.test = false; renderTestbar(); toast("GPS activé."); }
      if (first) { centerOn(la, lo, 40); const dc = Math.hypot(...proj(la, lo)) * MPU; if (dc > 9000) toast("Vous êtes hors de Paris : la carte reste consultable, les captures se font sur place."); }
      movePlayer(la, lo);
    }, err => gpsFail(err && err.code === 1 ? "Localisation refusée. Autorisez-la pour ce site dans les réglages du navigateur, puis touchez « Me localiser »." : "Position introuvable pour l'instant. Vérifiez que la localisation est activée."),
      { enableHighAccuracy: S.settings.hiacc !== false, maximumAge: 5000, timeout: 20000 });
  } catch (e) { gpsFail("Le GPS n'est pas disponible ici."); }
}
function stopGPS() { if (ui.gpsWatch != null) { try { navigator.geolocation.clearWatch(ui.gpsWatch); } catch (e) {} ui.gpsWatch = null; } }
$("zoomIn").onclick = () => zoomAt(v.W / 2, v.H / 2, 1.7);
$("zoomOut").onclick = () => zoomAt(v.W / 2, v.H / 2, 1 / 1.7);
$("meBtn").onclick = () => { if (!S.test && ui.gps !== "ok") startGPS(); centerOn(S.pos.lat, S.pos.lon, 45); };
$("fitBtn").onclick = fit;
$("cntEcusBtn").onclick = () => setMobile("shop");

/* ---------- Démarrage ---------- */
function refreshAll() {
  if (!ui.ready) return;
  const n = Object.keys(S.owned).filter(id => BYID.has(id)).length;
  $("cntCards").textContent = nf(n); $("cntEcus").textContent = nf(ecus());
  renderLayers(); renderSheet(); (RENDER[ui.view] || renderCollection)(); tickUI(packInfo()); renderTestbar(); renderQbar(); updateQuestBadge(); render();
}
initBasemap();
initServer();
new ResizeObserver(resize).observe(wrap);
resize(); setView("collection"); renderTestbar();
let streetsLoaded = false;
function loadStreets() {
  if (streetsLoaded || !ui.ready) return; streetsLoaded = true;
  fetch("data/streets.json").then(r => r.json()).then(st => {
    const P = new Path2D();
    for (const e of st.streets) {
      for (const r of e.r) {
        let a = 0, b = 0;
        for (let j = 0; j < r.length; j += 2) { a += r[j]; b += r[j + 1]; const q = proj(decLat(a), decLon(b)); j ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1]); }
        P.closePath();
      }
      const it = e.i && BYID.get(e.i);
      if (it && e.len > 0.4) { let ang = e.ang; if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI; STREET_LABELS.push({ x: it.p[0], y: it.p[1], ang, len: e.len, t: it.n }); }
    }
    STREET_PATH = P; render();
  }).catch(() => { streetsLoaded = false; });
}
Promise.all([fetch("data/places.json").then(r => r.json()), fetch("data/map.json").then(r => r.json()), fetch("data/quests.json").then(r => r.json()).catch(() => null)])
  .then(([pl, mp, qd]) => {
    prepare(pl, mp); if (qd) questsInit(qd); ui.ready = true;
    if (!SB_CONF) recomputeDone();
    if (SB && ui.user) syncServer();
    $("loading").hidden = true;
    refreshAll();
    centerOn(S.pos.lat, S.pos.lon, 30);
    if (!S.test) startGPS();
    loadStreets();
  })
  .catch(() => { $("loading").textContent = "Impossible de charger les données. Rechargez la page."; });
</script>

<script>
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
