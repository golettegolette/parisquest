<title>Parisquest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap">
<style>
/* Layout : carte plein écran en canvas, panneau latéral (bureau) ou onglets (mobile).
   Direction : plaques de rue émaillées (bleu nuit, cadre vert, lettres blanches) sur pierre de taille haussmannienne.
   Chaque famille de cartes a sa couleur d'émail. */
:root {
  --stone: #BBA987;
  --stone-2: #CDBF9F;
  --stone-3: #A3906B;
  --joint: rgba(70, 52, 24, .16);
  --navy: #172B4D;
  --navy-2: #233A60;
  --green: #1F4A36;
  --green-2: #2D6448;
  --white: #F6F2E8;
  --ink: #26221B;
  --ink-2: #5A5040;
  --water: #5E7D96;
  --bois: #97A079;
  --r0: #77715F; --r1: #3F7D62; --r2: #2D63B0; --r3: #7A3F8F; --r4: #B5862A;
  --f-plaque: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--stone); color: var(--ink); font-family: var(--f-ui); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--r4); outline-offset: 2px; }
sup { font-size: .62em; line-height: 0; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--stone); border-bottom: 1px solid var(--joint);
}
.logo {
  display: inline-flex; flex-direction: column; align-items: center;
  background: var(--navy); color: var(--white); border-radius: 7px; padding: 4px 14px 5px; margin: 3px; line-height: 1;
  box-shadow: 0 0 0 3px var(--green), inset 0 0 0 1.5px var(--white), 0 2px 0 3px rgba(0,0,0,.15);
}
.logo small { font-family: var(--f-plaque); font-weight: 500; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.logo strong { font-family: var(--f-plaque); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.counters { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.counter { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; padding: 4px 10px; border-radius: 6px; background: var(--stone-2); box-shadow: inset 0 0 0 1px var(--joint); }
.counter b { font-family: var(--f-plaque); font-size: 19px; font-weight: 700; color: var(--navy); white-space: nowrap; }
.counter span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

.main { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr; }
.map-wrap { position: relative; min-height: 0; overflow: hidden; background: var(--stone-3); }
#basemap { position: absolute; inset: 0; }
#basemap .maplibregl-ctrl-top-right { top: 196px; }
#basemap .maplibregl-ctrl-attrib { font-size: 11px; }
.has-basemap #map { pointer-events: none; }
#map { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-plaque); font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); background: var(--stone-3); }

.map-top {
  position: absolute; top: 10px;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(64px, calc(env(safe-area-inset-right, 0px) + 56px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none;
}
.testbar {
  pointer-events: auto; align-self: stretch;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  padding: 6px 8px; border-radius: 8px; background: rgba(246, 242, 232, .93);
  box-shadow: 0 1px 0 rgba(0,0,0,.08), inset 0 0 0 1px var(--joint); font-size: 13px;
}
.testbar .hint { flex: 1 1 160px; min-width: 0; color: var(--ink-2); }
.switch { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 4px; font-weight: 600; color: var(--navy); }
.switch i { width: 30px; height: 18px; border-radius: 9px; background: var(--stone-3); position: relative; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--white); transition: transform .2s; }
.switch[aria-pressed="true"] i { background: var(--green-2); }
.switch[aria-pressed="true"] i::after { transform: translateX(12px); }
.mini-btn { border: 0; border-radius: 5px; padding: 5px 9px; background: var(--navy); color: var(--white); font-family: var(--f-plaque); font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.mini-btn.ghost { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }

.layers { pointer-events: auto; align-self: stretch; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.layers::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px;
  padding: 5px 10px 5px 7px; background: rgba(246,242,232,.93); color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--joint); font-size: 13px; font-weight: 600;
}
.chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--white); }
.chip[aria-pressed="false"] { opacity: .5; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }

.tools { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; }
.tool { width: 40px; height: 40px; border: 0; border-radius: 8px; background: var(--navy); color: var(--white); box-shadow: 0 0 0 2px var(--green), 0 2px 6px rgba(0,0,0,.2); display: grid; place-items: center; }
.tool svg { width: 20px; height: 20px; }
.scalebar { margin-left: 4px; font-family: var(--f-plaque); font-size: 12px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; pointer-events: none; }
.scalebar i { display: block; height: 6px; border: 2px solid var(--navy); border-top: 0; margin-top: 2px; }

.sheet {
  position: absolute; bottom: 14px;
  left: max(14px, calc(env(safe-area-inset-left, 0px) + 14px)); right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px));
  max-width: 560px; margin-inline: auto; background: var(--navy); color: var(--white); border-radius: 10px;
  box-shadow: 0 0 0 4px var(--green), inset 0 0 0 1.5px var(--white), 0 8px 24px rgba(10,16,30,.35);
  padding: 13px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
}
.sheet-text { flex: 1 1 220px; min-width: 0; }
.eyebrow { font-family: var(--f-plaque); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .78; display: flex; align-items: center; gap: 6px; }
.eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--white); }
.sheet h2 { margin: 2px 0; font-family: var(--f-plaque); font-weight: 700; font-size: 21px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.sheet p { margin: 0; font-size: 13.5px; opacity: .9; }
.sheet .dist { font-family: var(--f-plaque); font-weight: 600; font-size: 15px; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 7px; padding: 11px 18px; background: var(--green-2); color: var(--white); box-shadow: inset 0 0 0 1.5px rgba(246,242,232,.55); font-family: var(--f-plaque); font-weight: 700; font-size: 16px; letter-spacing: .07em; text-transform: uppercase; transition: transform .12s, filter .12s; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { background: transparent; color: rgba(246,242,232,.6); box-shadow: inset 0 0 0 1.5px rgba(246,242,232,.3); cursor: default; }
.btn.light { background: var(--white); color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }
.btn.small { padding: 8px 12px; font-size: 14px; }

.side {
  position: absolute; inset: 0; z-index: 5; overflow-y: auto; overscroll-behavior: contain;
  background-color: var(--stone);
  background-image: repeating-linear-gradient(180deg, transparent 0 58px, var(--joint) 58px 59px);
  padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app[data-mobile="map"] .side { display: none; }
.side-tabs { display: none; }
.view { display: flex; flex-direction: column; gap: 18px; }
.view h2 { margin: 3px 0 0 3px; align-self: flex-start; font-family: var(--f-plaque); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .06em; background: var(--navy); color: var(--white); padding: 5px 12px 4px; border-radius: 6px; box-shadow: 0 0 0 3px var(--green), inset 0 0 0 1.5px var(--white); }
.view h3 { margin: 0 0 8px; font-family: var(--f-plaque); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.lede { margin: 0; color: var(--ink-2); max-width: 60ch; line-height: 1.45; }
.panel { background: rgba(205, 191, 159, .88); border-radius: 10px; padding: 14px; box-shadow: inset 0 0 0 1px var(--joint); }
.tiers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tier { border-radius: 6px; padding: 6px 4px 5px; text-align: center; color: var(--white); line-height: 1.1; }
.tier b { display: block; font-family: var(--f-plaque); font-size: 18px; font-variant-numeric: tabular-nums; }
.tier span { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }

.fams { display: flex; flex-direction: column; gap: 6px; }
.fam { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 10px; align-items: center; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 7px; }
.fam:hover { background: rgba(246,242,232,.45); }
.fam[aria-pressed="true"] { background: var(--white); box-shadow: inset 0 0 0 1.5px var(--navy); }
.fam i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
.fam strong { font-weight: 600; color: var(--navy); }
.fam .n { font-family: var(--f-plaque); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.fam .bar { grid-column: 2 / -1; height: 5px; border-radius: 3px; background: rgba(38,34,27,.12); overflow: hidden; }
.fam .bar b { display: block; height: 100%; background: var(--c); min-width: 2px; }

.cols { display: flex; flex-direction: column; gap: 10px; }
.col { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
.col strong { font-weight: 600; color: var(--navy); }
.col .n { font-family: var(--f-plaque); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.col .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: rgba(38,34,27,.12); overflow: hidden; }
.col .bar i { display: block; height: 100%; background: var(--c, var(--green-2)); border-radius: 3px; }
.col.done .bar i { background: var(--r4); }
.col .sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.grid-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.grid-head h3 { margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
.grid > button { border: 0; padding: 0; background: none; text-align: left; }
.more { margin-top: 12px; }
.reset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.empty { padding: 16px; border-radius: 10px; border: 1.5px dashed rgba(38,34,27,.3); color: var(--ink-2); text-align: center; line-height: 1.4; }

.booster { border: 0; width: 100%; max-width: 360px; align-self: center; background: var(--navy); color: var(--white); border-radius: 12px; box-shadow: 0 0 0 5px var(--green), inset 0 0 0 2px var(--white), 0 10px 24px rgba(10,16,30,.3); padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 6px 5px; }
.booster .k { font-family: var(--f-plaque); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.booster .t { font-family: var(--f-plaque); font-size: 28px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.booster .s { font-size: 13px; opacity: .85; }
.booster .cta { margin-top: 8px; }
.scouts { display: flex; flex-direction: column; gap: 10px; }
.scout { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; background: var(--stone-2); border-radius: 10px; padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--joint); }
.scout .ring { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--white); box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--green-2); font-family: var(--f-plaque); font-weight: 700; font-size: 20px; }
.scout strong { display: block; color: var(--navy); font-weight: 600; line-height: 1.2; }
.scout span { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--navy); box-shadow: 0 -3px 0 var(--green); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); position: relative; z-index: 6; }
.tabbar button { border: 0; background: none; color: rgba(246,242,232,.65); padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--f-plaque); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--white); }
.tabbar button[aria-current="page"] svg { color: #9FD0B4; }
.tabbar .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--r4); color: var(--navy); font-size: 11px; line-height: 16px; margin-left: 3px; }

@media (min-width: 900px) {
  .main { grid-template-columns: 1fr 420px; }
  .side { position: relative; inset: auto; display: block !important; border-left: 4px solid var(--green); }
  .tabbar { display: none; }
  .side-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .side-tabs button { border: 0; border-radius: 6px; padding: 7px 12px; background: var(--stone-2); color: var(--ink-2); font-family: var(--f-plaque); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; box-shadow: inset 0 0 0 1px var(--joint); }
  .side-tabs button[aria-pressed="true"] { background: var(--navy); color: var(--white); box-shadow: 0 0 0 2px var(--green); }
  .view h2 { display: none; }
}

/* Cartes */
.card { position: relative; width: 100%; aspect-ratio: 5 / 7; max-width: 100%; container-type: inline-size; perspective: 1400px; }
.card .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.3,1); }
.card.flipped .flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-size: 5cqw; border-radius: .7em; background: var(--green); padding: .42em; box-shadow: 0 .15em .5em rgba(10,16,30,.25); }
.face.back { transform: rotateY(180deg); }
.face-in { height: 100%; border-radius: .45em; background: var(--navy); color: var(--white); box-shadow: inset 0 0 0 .12em var(--white); padding: .75em .75em 0; display: flex; flex-direction: column; gap: .4em; overflow: hidden; }
.c-top { display: flex; justify-content: space-between; align-items: center; gap: .5em; font-family: var(--f-plaque); font-size: .78em; letter-spacing: .06em; white-space: nowrap; }
.c-top .type { text-transform: uppercase; font-weight: 600; letter-spacing: .08em; padding: .1em .55em; border-radius: .3em; background: var(--c); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.c-name { font-family: var(--f-plaque); font-weight: 700; font-size: 1.45em; line-height: .98; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 1.96em; }
.c-latin { font-family: var(--f-text); font-style: italic; font-size: .76em; opacity: .78; margin-top: -.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3em; }
.c-art { flex: 1; min-height: 0; position: relative; border-radius: .3em; overflow: hidden; background-color: var(--stone-2); background-image: repeating-linear-gradient(180deg, transparent 0 1.9em, var(--joint) 1.9em 2em), linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.06)); }
.c-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.c-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.credits { font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.credits a { color: var(--navy); }
.pips { position: absolute; top: .45em; left: .5em; display: flex; gap: .22em; }
.pips i { width: .55em; height: .55em; transform: rotate(45deg); background: rgba(23,43,77,.2); border: .08em solid var(--navy); }
.pips i.on { background: var(--navy); }
.lab { position: absolute; top: .4em; right: .45em; font-family: var(--f-plaque); font-size: .62em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--white); background: var(--c); padding: .1em .4em; border-radius: .25em; }
.c-stats { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: .3em; text-align: center; }
.c-stats div { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.c-stats small { font-family: var(--f-plaque); font-size: .58em; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.c-stats b { font-family: var(--f-plaque); font-size: 1.05em; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-stats b.long { font-size: .8em; padding-top: .15em; }
.c-band { margin: 0 -.75em; padding: .35em .75em .45em; display: flex; justify-content: space-between; align-items: baseline; gap: .6em; color: var(--white); }
.c-band b { font-family: var(--f-plaque); font-size: .8em; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.c-band span { font-size: .6em; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.back .face-in { padding: .9em; gap: .5em; }
.back h4 { margin: 0; font-family: var(--f-plaque); font-weight: 700; font-size: 1.2em; text-transform: uppercase; line-height: 1; }
.back .why { font-family: var(--f-text); font-size: .74em; line-height: 1.35; margin: 0; padding: .45em .55em; background: rgba(246,242,232,.1); border-radius: .3em; }
.back .desc { flex: 1; min-height: 0; overflow-y: auto; font-family: var(--f-text); font-size: .72em; line-height: 1.45; margin: 0; padding-right: .3em; }
.back .meta { font-size: .62em; line-height: 1.4; opacity: .8; }
.back .links { display: flex; gap: .5em; flex-wrap: wrap; }
.back .links a { font-family: var(--f-plaque); font-weight: 600; font-size: .72em; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); background: var(--white); padding: .3em .6em; border-radius: .3em; text-decoration: none; }

.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(14, 21, 34, .78); padding: 20px max(16px, env(safe-area-inset-left, 0px)) 20px max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.modal-box { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(330px, 100%); }
.modal-msg { text-align: center; color: var(--white); }
.modal-msg .k { font-family: var(--f-plaque); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
.modal-msg .t { font-family: var(--f-plaque); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; }
.modal-msg .s { font-size: 14px; opacity: .9; margin-top: 4px; }
#modalCard { width: min(320px, 100%, calc((100vh - 230px) * 5 / 7)); min-width: 200px; }
.modal .card { width: 100%; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.reveal { animation: reveal .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes reveal { from { transform: translateY(24px) scale(.82) rotateY(70deg); opacity: 0; } to { transform: none; opacity: 1; } }
.glow .face { box-shadow: 0 0 0 .1em var(--glow), 0 0 1.6em .3em var(--glow); }

<script>
/* ---------- Géographie ---------- */
const LAT0 = 48.8566, LON0 = 2.3522, K = 1000, COS0 = Math.cos(LAT0 * Math.PI / 180);

const PERIPH = [[48.8985,2.3597],[48.8990,2.3705],[48.8975,2.3860],[48.8880,2.3925],[48.8770,2.4065],[48.8640,2.4100],[48.8535,2.4110],[48.8470,2.4110],[48.8355,2.4060],[48.8290,2.4020],[48.8225,2.3930],[48.8215,2.3690],[48.8190,2.3595],[48.8165,2.3445],[48.8230,2.3255],[48.8270,2.3050],[48.8320,2.2875],[48.8360,2.2650],[48.8380,2.2565],[48.8480,2.2580],[48.8590,2.2690],[48.8715,2.2765],[48.8780,2.2825],[48.8860,2.2920],[48.8915,2.3020],[48.8945,2.3135],[48.8975,2.3290],[48.8995,2.3445]];
const SEINE = [[48.8165,2.4140],[48.8215,2.4010],[48.8260,2.3890],[48.8300,2.3820],[48.8340,2.3770],[48.8380,2.3712],[48.8435,2.3655],[48.8480,2.3605],[48.8505,2.3560],[48.8530,2.3490],[48.8560,2.3430],[48.8580,2.3370],[48.8600,2.3290],[48.8630,2.3210],[48.8640,2.3130],[48.8630,2.3020],[48.8600,2.2930],[48.8560,2.2875],[48.8500,2.2810],[48.8460,2.2755],[48.8395,2.2670],[48.8340,2.2560],[48.8285,2.2420],[48.8260,2.2310],[48.8330,2.2235],[48.8440,2.2215],[48.8560,2.2240],[48.8680,2.2260],[48.8790,2.2370],[48.8850,2.2550],[48.8930,2.2700]];
const ARR = [["1",48.8625,2.3364],["2",48.8683,2.3428],["3",48.8630,2.3600],["4",48.8543,2.3576],["5",48.8445,2.3500],["6",48.8491,2.3328],["7",48.8562,2.3122],["8",48.8727,2.3125],["9",48.8770,2.3375],["10",48.8761,2.3608],["11",48.8590,2.3800],["12",48.8400,2.3880],["13",48.8283,2.3622],["14",48.8292,2.3266],["15",48.8401,2.2928],["16",48.8604,2.2790],["17",48.8873,2.3067],["18",48.8925,2.3484],["19",48.8871,2.3848],["20",48.8634,2.4011]];
let BOUNDS = (() => { const ps = PERIPH.map(([a, b]) => proj(a, b)).concat([proj(48.8460, 2.4700), proj(48.8800, 2.2250), proj(48.8180, 2.4600)]); const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]); return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) }; })();

function bearing(a, b) {
  const deg = (Math.atan2(b.p[0] - a[0], -(b.p[1] - a[1])) * 180 / Math.PI + 360) % 360;
  return ["nord", "nord-est", "est", "sud-est", "sud", "sud-ouest", "ouest", "nord-ouest"][Math.round(deg / 45) % 8];
}
const fmtDist = m => m < 1000 ? `${Math.max(5, Math.round(m / 5) * 5)} m` : `${(m / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} km`;

/* ---------- Règles ---------- */
const TIERS = ["Commune", "Peu commune", "Rare", "Épique", "Légendaire"];
const TIER_VAR = ["--r0", "--r1", "--r2", "--r3", "--r4"];
const REWARD = [10, 15, 25, 40, 60];
const BOOSTER_SIZE = 5, SCOUT_DAYS = 7, MAX_LEVEL = 5;
const CONIFERS = new Set(["Pinus", "Taxus", "Araucaria", "Taxodium", "Cedrus", "Sequoia", "Sequoiadendron", "Abies", "Picea", "Cupressus", "Metasequoia", "Larix", "Calocedrus", "Cryptomeria", "Thuja", "Juniperus", "Pseudotsuga", "Cephalotaxus", "Chamaecyparis", "Torreya"]);
const DAYS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];

let FAMS = {}, KINDS = {}, ITEMS = [], COLS = [], BYID = new Map(), TOTALS = {};
let PARK_PATHS = null, MONDE_PATHS = [], ARR_PATH = null, WATER_PATH = null, STREET_PATH = null, STREET_LABELS = [];

/* ---------- État ---------- */
const STORE_KEY = "parisquest.v2";
/* Version hébergée (GitHub Pages ou serveur local) : vrai GPS, fond de carte, photos. Le mode test n'y est visible qu'avec ?test dans l'adresse. */
const HOSTED = !!window.PQ_HOSTED;
const TEST_ALLOWED = !HOSTED || /[?&]test\b/.test(location.search);
const DEFAULT_STATE = () => ({ pos: { lat: 48.8600, lon: 2.3565 }, owned: {}, ecus: 0, scouts: [], lastBooster: null, dayOffset: 0, done: {}, hidden: {}, test: !HOSTED });
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(DEFAULT_STATE(), JSON.parse(raw));
    const v1 = localStorage.getItem("parisquest.v1");
    if (v1) { const o = JSON.parse(v1); const s = DEFAULT_STATE(); s.ecus = o.ecus || 0; s.pos = o.pos || s.pos; s.dayOffset = o.dayOffset || 0; for (const id in (o.owned || {})) s.owned["arbre:" + id] = o.owned[id]; return s; }
  } catch (e) {}
  return DEFAULT_STATE();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
if (!TEST_ALLOWED) { S.test = false; S.dayOffset = 0; }
if (!HOSTED) S.test = true;
const ui = { sel: null, cycle: 0, mobile: "map", view: "collection", fam: null, shown: 48, resetArmed: false, gpsWatch: null, ready: false, gps: "off", acc: null, firstFix: true };
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000) + S.dayOffset;
const simDate = () => new Date(Date.now() + S.dayOffset * 86400000);

/* ---------- Utilitaires ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const arrLabel = ar => !ar ? "Paris" : `${esc(ar)}<sup>${ar === "1" ? "er" : "e"}</sup> Arr<sup>t</sup>`;
const nf = n => Number(n).toLocaleString("fr-FR");
function seeded(id) { let h = 2166136261; for (const c of String(id)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0) % 1000) / 1000; }
const famOf = it => KINDS[it.k].f;
const famColor = it => FAMS[famOf(it)].color;
const visible = it => !S.hidden[famOf(it)];
let toastTimer;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3600); }

/* ---------- Préparation des données ---------- */
const CELL = 3; // unités projetées (≈ 330 m)
const GRID = new Map();
const cellKey = (cx, cy) => cx * 100000 + cy;
function gridAdd(cx, cy, idx) { const k = cellKey(cx, cy); let a = GRID.get(k); if (!a) GRID.set(k, a = []); if (a[a.length - 1] !== idx) a.push(idx); }
function prepare(pl, mp) {
  FAMS = pl.families; KINDS = pl.kinds; ITEMS = pl.items; COLS = pl.collections;
  const parkRings = mp.parks.map(p => ({ c: p.c, i: p.i, rings: p.r.map(r => { const out = new Float64Array(r.length); for (let j = 0; j < r.length; j += 2) { const q = proj(decLat(r[j]), decLon(r[j + 1])); out[j] = q[0]; out[j + 1] = q[1]; } return out; }) }));
  const mondeRings = (mp.monde || []).map(rs => rs.map(r => { const out = new Float64Array(r.length); for (let j = 0; j < r.length; j += 2) { const q = proj(decLat(r[j]), decLon(r[j + 1])); out[j] = q[0]; out[j + 1] = q[1]; } return out; }));
  PARK_PATHS = { park: new Path2D(), cim: new Path2D(), bois: new Path2D() };
  for (const p of parkRings) for (const r of p.rings) { const P = PARK_PATHS[p.c] || PARK_PATHS.park; P.moveTo(r[0], r[1]); for (let j = 2; j < r.length; j += 2) P.lineTo(r[j], r[j + 1]); P.closePath(); }
  const ringsToPath = (P, rings) => { for (const r of rings) { for (let j = 0; j < r.length; j += 2) { const q = proj(decLat(r[j]), decLon(r[j + 1])); j ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1]); } P.closePath(); } };
  if (mp.arr && mp.arr.length) {
    ARR_PATH = new Path2D(); mp.arr.forEach(a => ringsToPath(ARR_PATH, a.r));
    ARR_P = mp.arr.filter(a => a.at && a.at[0]).map(a => [a.n + (a.n === "1" ? "er" : "e"), proj(a.at[0], a.at[1])]);
  }
  if (mp.water && mp.water.length) { WATER_PATH = new Path2D(); mp.water.forEach(rs => ringsToPath(WATER_PATH, rs)); }
  MONDE_PATHS = mondeRings.map(rs => { const P = new Path2D(); for (const r of rs) { P.moveTo(r[0], r[1]); for (let j = 2; j < r.length; j += 2) P.lineTo(r[j], r[j + 1]); P.closePath(); } return P; });
  ITEMS.forEach((it, idx) => {
    it.idx = idx;
    if (it.p && it.p.startsWith("c:")) it.ph = "https://commons.wikimedia.org/wiki/Special:FilePath/" + it.p.slice(2); else if (it.p) it.ph = it.p;
    if (it.wp) it.wp = "https://fr.wikipedia.org/wiki/" + it.wp;
    it.p = proj(it.a, it.o);
    const kd = KINDS[it.k], x = it.x || {};
    it.rad = x.rad || (it.k === "arbre" && x.bois ? 100 : kd.rad);
    if (x.pts && x.pts.length) {
      it.pts = new Float64Array(x.pts.length);
      for (let j = 0; j < x.pts.length; j += 2) { const q = proj(decLat(x.pts[j]), decLon(x.pts[j + 1])); it.pts[j] = q[0]; it.pts[j + 1] = q[1]; gridAdd(Math.floor(q[0] / CELL), Math.floor(q[1] / CELL), idx); }
    }
    if (x.poly != null && parkRings[x.poly]) it.poly = parkRings[x.poly].rings;
    if (x.mpoly != null && mondeRings[x.mpoly]) it.poly = mondeRings[x.mpoly];
    if (it.poly) {
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const r of it.poly) for (let j = 0; j < r.length; j += 2) { x0 = Math.min(x0, r[j]); x1 = Math.max(x1, r[j]); y0 = Math.min(y0, r[j + 1]); y1 = Math.max(y1, r[j + 1]); }
      for (let cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++) for (let cy = Math.floor(y0 / CELL); cy <= Math.floor(y1 / CELL); cy++) gridAdd(cx, cy, idx);
    }
    gridAdd(Math.floor(it.p[0] / CELL), Math.floor(it.p[1] / CELL), idx);
    BYID.set(it.i, it);
    const f = kd.f; TOTALS[f] = (TOTALS[f] || 0) + 1;
  });
}
function candidates(px, py, rUnits) {
  const out = new Set();
  const c0x = Math.floor((px - rUnits) / CELL), c1x = Math.floor((px + rUnits) / CELL), c0y = Math.floor((py - rUnits) / CELL), c1y = Math.floor((py + rUnits) / CELL);
  for (let cx = c0x; cx <= c1x; cx++) for (let cy = c0y; cy <= c1y; cy++) { const a = GRID.get(cellKey(cx, cy)); if (a) for (const i of a) out.add(i); }
  return out;
}
function inPoly(rings, x, y) {
  let inside = false;
  for (const r of rings) for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) {
    const xi = r[i], yi = r[i + 1], xj = r[j], yj = r[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }

}
function segDist(px, py, ax, ay, bx, by) {

  let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);

/* distance en mètres entre la position projetée et un lieu */
function distTo(it, P) {
  if (it.poly) {
    if (inPoly(it.poly, P[0], P[1])) return 0;
    let d = Infinity;
    for (const r of it.poly) for (let i = 0; i < r.length - 2; i += 2) d = Math.min(d, segDist(P[0], P[1], r[i], r[i + 1], r[i + 2], r[i + 3]));
    return d * MPU;
  }
  let d = Math.hypot(it.p[0] - P[0], it.p[1] - P[1]);
  if (it.pts) for (let j = 0; j < it.pts.length; j += 2) d = Math.min(d, Math.hypot(it.pts[j] - P[0], it.pts[j + 1] - P[1]));
  return d * MPU;
}

/* Marchés : ouverts seulement aux jours et heures du marché */
function marketStatus(it, date = simDate()) {
  const x = it.x || {}; if (!x.mk) return null;
  const di = (date.getDay() + 6) % 7;
  const hr = x.hr || [];
  const slot = di < 5 ? [hr[0], hr[1]] : di === 5 ? [hr[2], hr[3]] : [hr[4], hr[5]];
  const toMin = s => { const m = /^(\d\d):(\d\d)/.exec(s || ""); return m ? +m[1] * 60 + +m[2] : null; };
  const now = date.getHours() * 60 + date.getMinutes();
  const a = toMin(slot[0]) ?? 420, b = toMin(slot[1]) ?? 840;
  const open = !!x.mk[di] && now >= a && now <= b;
  const days = DAYS.filter((d, i) => x.mk[i]).join(", ");
  return { open, text: open ? `Ouvert jusqu'à ${slot[1] || "14:00"}` : `Ouvert le ${days}` };
}

/* ---------- Illustrations ---------- */
const ART = {
  tree(it) {
    const x = it.x || {}, rnd = seeded(it.i), k = .62 + .38 * Math.min(1, (x.h || 12) / 35), base = 80, tw = 4 + Math.min(8, (x.c || 100) / 90);
    const crown = x.g === "Ginkgo" ? "#C59A2E" : x.g === "Taxodium" ? "#9A5A33" : "#2F5B40", light = x.g === "Ginkgo" ? "#DDB64A" : x.g === "Taxodium" ? "#B87245" : "#41745A";
    let s = `<ellipse cx="50" cy="${base + 1}" rx="30" ry="3.2" fill="rgba(40,30,15,.2)"/>`;
    if (CONIFERS.has(x.g)) {
      s += `<rect x="${50 - tw / 2}" y="${base - 14 * k}" width="${tw}" height="${14 * k}" fill="#5B4632"/>`;
      for (let i = 0; i < 3; i++) { const w = (30 - i * 7) * k * (.9 + rnd() * .2), yb = base - (10 + i * 17) * k; s += `<polygon points="${50 - w},${yb} ${50 + w},${yb} 50,${yb - 30 * k}" fill="${i % 2 ? light : crown}"/>`; }
    } else {
      const ct = base - 44 * k;
      s += `<path d="M${50 - tw / 2} ${base} L${50 - tw / 2.6} ${ct + 6} L${50 + tw / 2.6} ${ct + 6} L${50 + tw / 2} ${base} Z" fill="#5B4632"/>`;
      [[0, -2, 24], [-17, 6, 16], [17, 6, 16], [-8, -16, 15], [10, -14, 15], [0, -26, 12]].forEach(([dx, dy, r], i) => { s += `<circle cx="${50 + dx * k + (rnd() - .5) * 4}" cy="${ct + dy * k + (rnd() - .5) * 3}" r="${r * k * (.9 + rnd() * .2)}" fill="${i > 2 ? light : crown}"/>`; });
    }
    if (x.eph) s += `<rect x="${50 - tw}" y="${base - 22}" width="${tw * 2}" height="5" fill="#B23A2E"/><path d="M28 70 L72 70" stroke="#B23A2E" stroke-width="0" />`;
    return s;

$("testToggle").onclick = () => { if (S.test) { startGPS(); return; } stopGPS(); S.test = true; renderTestbar(); renderSheet(); };
$("gpsBtn").onclick = startGPS;
$("nextDay").onclick = () => { S.dayOffset += 1; pruneScouts(); save(); refreshAll(); toast("Un jour passe. Nouveau repérage disponible, et vos cartes peuvent à nouveau monter de niveau."); };
function gpsFail(msg) {
  stopGPS();
  if (TEST_ALLOWED) { S.test = true; ui.gps = "off"; renderTestbar(); toast(HOSTED ? msg : "Le GPS n'est pas disponible ici. Ouvrez la version hébergée sur votre téléphone, ou restez en mode test."); }
  else { ui.gps = "denied"; toast(msg); }
  renderSheet(); render();
}
function startGPS() {
  if (!("geolocation" in navigator)) { gpsFail("Ce navigateur ne donne pas accès à la position."); return; }
  if (ui.gpsWatch != null) return;
  ui.gps = "wait"; renderSheet();
  try {
    ui.gpsWatch = navigator.geolocation.watchPosition(p => {
      const { latitude: la, longitude: lo, accuracy } = p.coords;
      ui.acc = accuracy; const first = ui.gps !== "ok"; ui.gps = "ok";
      if (S.test) { S.test = false; renderTestbar(); toast("GPS activé."); }
      if (first) { centerOn(la, lo, 40); const dc = Math.hypot(...proj(la, lo)) * MPU; if (dc > 9000) toast("Vous êtes hors de Paris : la carte reste consultable, les captures se font sur place."); }
      movePlayer(la, lo);
    }, err => gpsFail(err && err.code === 1 ? "Localisation refusée. Autorisez-la pour ce site dans les réglages du navigateur, puis touchez « Me localiser »." : "Position introuvable pour l'instant. Vérifiez que la localisation est activée."),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  } catch (e) { gpsFail("Le GPS n'est pas disponible ici."); }
}
function stopGPS() { if (ui.gpsWatch != null) { try { navigator.geolocation.clearWatch(ui.gpsWatch); } catch (e) {} ui.gpsWatch = null; } }
$("zoomIn").onclick = () => zoomAt(v.W / 2, v.H / 2, 1.7);
$("zoomOut").onclick = () => zoomAt(v.W / 2, v.H / 2, 1 / 1.7);
$("meBtn").onclick = () => { if (!S.test && ui.gps !== "ok") startGPS(); centerOn(S.pos.lat, S.pos.lon, 45); };
$("fitBtn").onclick = fit;

/* ---------- Démarrage ---------- */
function refreshAll() {
  if (!ui.ready) return;
  const n = Object.keys(S.owned).filter(id => BYID.has(id)).length;
  $("cntCards").textContent = `${nf(n)} / ${nf(ITEMS.length)}`; $("cntEcus").textContent = nf(S.ecus);
  renderLayers(); renderSheet(); renderCollection(); renderReperage(); renderTestbar(); render();
}
initBasemap();
new ResizeObserver(resize).observe(wrap);
resize(); setView("collection"); renderTestbar();
let streetsLoaded = false;
function loadStreets() {
  if (streetsLoaded || ML || !ui.ready) return; streetsLoaded = true;
  fetch("data/streets.json").then(r => r.json()).then(st => {
    const P = new Path2D();
    for (const e of st.streets) {
      for (const r of e.r) {
        let a = 0, b = 0;
        for (let j = 0; j < r.length; j += 2) { a += r[j]; b += r[j + 1]; const q = proj(decLat(a), decLon(b)); j ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1]); }
        P.closePath();
      }
      const it = e.i && BYID.get(e.i);
      if (it && e.len > 0.4) { let ang = e.ang; if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI; STREET_LABELS.push({ x: it.p[0], y: it.p[1], ang, len: e.len, t: it.n }); }
    }
    STREET_PATH = P; render();
  }).catch(() => { streetsLoaded = false; });
}
Promise.all([fetch("data/places.json").then(r => r.json()), fetch("data/map.json").then(r => r.json())])
  .then(([pl, mp]) => {
    prepare(pl, mp); ui.ready = true; pruneScouts();
    $("loading").hidden = true;
    refreshAll();
    centerOn(S.pos.lat, S.pos.lon, 30);
    if (!S.test) startGPS();
    loadStreets();
  })
  .catch(() => { $("loading").textContent = "Impossible de charger les données. Rechargez la page."; });
</script>
